<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform health — Digital-i</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-wash: rgba(12,163,12,0.12); --warning-wash: rgba(250,178,25,0.16);
  --serious-wash: rgba(236,131,90,0.16); --critical-wash: rgba(208,59,59,0.13);
  --seq: #2a78d6; --seq-track: #cde2fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
    --seq: #3987e5; --seq-track: #0d366b;
    --good-wash: rgba(12,163,12,0.20); --warning-wash: rgba(250,178,25,0.16);
    --serious-wash: rgba(236,131,90,0.18); --critical-wash: rgba(208,59,59,0.22);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
  --seq: #3987e5; --seq-track: #0d366b;
  --good-wash: rgba(12,163,12,0.20); --warning-wash: rgba(250,178,25,0.16);
  --serious-wash: rgba(236,131,90,0.18); --critical-wash: rgba(208,59,59,0.22);
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 24px; max-width: 1240px; margin: 0 auto;
}
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 15px; font-weight: 650; margin: 0 0 12px; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--muted); }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header .spacer { flex: 1; }
button.theme { background: var(--surface); color: var(--ink-2); border: 1px solid var(--grid); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }

.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
.filters .label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip {
  background: var(--surface); border: 1px solid var(--grid); color: var(--ink-2);
  border-radius: 999px; padding: 3px 12px; cursor: pointer; font: inherit; font-size: 12.5px;
}
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.chip .check { display: none; font-weight: 700; }
.chip[aria-pressed="true"] .check { display: inline; }
.filters .divider { width: 1px; height: 18px; background: var(--grid); margin: 0 6px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-size: 30px; font-weight: 650; margin-top: 2px; }
.tile.hero .value { font-size: 48px; line-height: 1.1; }
.tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .frac { font-size: 18px; color: var(--muted); font-weight: 500; }
.tile .split { display: flex; gap: 14px; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); align-items: center; }

.section { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px; margin-bottom: 20px; overflow-x: auto; }

.status-ic { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; }
.st-good .status-ic { background: var(--good); }
.st-warning .status-ic { background: var(--warning); color: #1a1a19; }
.st-serious .status-ic { background: var(--serious); color: #1a1a19; }
.st-critical .status-ic { background: var(--critical); }
.st-none .status-ic { background: transparent; color: var(--muted); border: 1px dashed var(--baseline); }

table.matrix { border-collapse: separate; border-spacing: 2px; }
table.matrix th { font-size: 12px; color: var(--muted); font-weight: 500; padding: 4px 8px; text-align: left; }
table.matrix th.rowh { text-align: right; padding-right: 10px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
td.cell { padding: 0; }
td.cell .box {
  width: 64px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  gap: 5px; cursor: default; border: 1px solid transparent; font-size: 12px; color: var(--ink-2);
}
td.cell .box:hover, td.cell .box:focus-visible { border-color: var(--ink); outline: none; }
.st-good .box { background: var(--good-wash); }
.st-warning .box { background: var(--warning-wash); }
.st-serious .box { background: var(--serious-wash); }
.st-critical .box { background: var(--critical-wash); }
.st-none .box { background: transparent; border: 1px dashed var(--grid); }
td.cell .box.stale { opacity: 0.55; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

ul.obs { list-style: none; display: grid; gap: 8px; }
ul.obs li { display: flex; gap: 10px; align-items: baseline; }
ul.obs li .status-ic { position: relative; top: 2px; }
ul.obs .what { font-weight: 600; }
ul.obs .detail { color: var(--ink-2); }
ul.obs .where { color: var(--muted); font-size: 12px; white-space: nowrap; }

.plat-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.plat-head .count { color: var(--muted); font-size: 12px; }
.region-block { border-top: 1px solid var(--grid); margin-top: 14px; padding-top: 12px; }
.region-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.region-head .rg { font-weight: 650; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; }
.region-head .meta { color: var(--muted); font-size: 12px; }
.region-head .chipst { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.headline { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 8px; }

table.points { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.points th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11.5px; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--grid); }
table.points td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.points tr:last-child td { border-bottom: none; }
table.points .nm { white-space: nowrap; }
table.points .prof { color: var(--muted); font-size: 11px; }
table.points td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.points .iss { color: var(--ink-2); max-width: 460px; }
.latbar { display: inline-flex; align-items: center; gap: 6px; }
.latbar .track { width: 90px; height: 8px; border-radius: 4px; background: var(--seq-track); overflow: hidden; }
.latbar .fill { height: 100%; background: var(--seq); border-radius: 0 4px 4px 0; }

.strip { display: inline-flex; gap: 2px; align-items: center; }
.strip .sq { width: 10px; height: 14px; border-radius: 3px; cursor: default; }
.strip .sq:hover { outline: 1px solid var(--ink); }
.sq.st-good { background: var(--good); } .sq.st-warning { background: var(--warning); }
.sq.st-serious { background: var(--serious); } .sq.st-critical { background: var(--critical); }

#tooltip {
  position: fixed; z-index: 10; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; pointer-events: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18); max-width: 340px; display: none;
}
#tooltip .t-val { font-weight: 650; font-size: 12.5px; }
#tooltip .t-sub { color: var(--ink-2); }
#tooltip .t-mut { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }
footer { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
</style>
</head>

function durationOf(r) {
  if (!r.endTs) return null;
  var ms = new Date(r.endTs) - new Date(r.ts);
  return ms >= 0 ? (ms < 60000 ? Math.round(ms / 1000) + 's' : Math.round(ms / 60000) + 'm') : null;
}
function statusOf(r) {
  if (!r) return 'none';
  if (r.status === 'logged_out' || r.status === 'error' || (r.status !== 'complete' && r.verdict !== 'pass')) return 'serious';
  if (r.verdict === 'fail') return 'critical';
  return r.warnCount > 0 ? 'warning' : 'good';
}
function isStale(r) { return NOW - new Date(r.ts).getTime() > 6048e5; }
function winMs() { for (var i = 0; i < WINDOWS.length; i++) if (WINDOWS[i][0] === state.win) return WINDOWS[i][1]; return Infinity; }
function runsInWin() {
  var cut = winMs();
  return DATA.runs.filter(function (r) {
    return state.plats[r.platform] && (cut === Infinity || NOW - new Date(r.ts).getTime() <= cut);
  });
}
function latestCells(runs) {
  var map = {}; // platform -> region -> run (runs are sorted ascending by ts)
  runs.forEach(function (r) {
    if (!map[r.platform]) map[r.platform] = {};
    map[r.platform][r.region] = r;
  });
  return map;
}
function statusIcon(st) {
  var wrap = el('span', 'st-' + st);
  var ic = el('span', 'status-ic', STATUS_META[st].icon);
  ic.setAttribute('aria-hidden', 'true');
  wrap.appendChild(ic);
  return wrap;
}

/* ---- tooltip (per-mark hover; values lead, labels follow) ---- */
var tip = null;
function showTip(evt, lines) {
  if (!tip) { tip = el('div'); tip.id = 'tooltip'; document.body.appendChild(tip); }
  tip.textContent = '';
  lines.forEach(function (l) { tip.appendChild(el('div', l[0], l[1])); });
  tip.style.display = 'block';
  var x = Math.min(evt.clientX + 14, window.innerWidth - 360);
  var y = Math.min(evt.clientY + 14, window.innerHeight - tip.offsetHeight - 16);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { if (tip) tip.style.display = 'none'; }
function attachTip(node, linesFn) {
  node.addEventListener('pointermove', function (e) { showTip(e, linesFn()); });
  node.addEventListener('pointerleave', hideTip);
  node.tabIndex = 0;
  node.addEventListener('focus', function () {
    var r = node.getBoundingClientRect();
    showTip({ clientX: r.left + r.width / 2, clientY: r.bottom + 2 }, linesFn());
  });
  node.addEventListener('blur', hideTip);
}
function cellTipLines(r, st) {
  var lines = [ ['t-val', STATUS_META[st].label], ['t-sub', LABELS[r.platform] + ' \u00b7 ' + r.region.toUpperCase()] ];
  lines.push(['t-mut', ago(r.ts) + (durationOf(r) ? ' \u00b7 took ' + durationOf(r) : '') + (isStale(r) ? ' \u00b7 STALE (>7d old)' : '')]);
  if (r.failed && r.failed.length) lines.push(['t-sub', 'failing: ' + r.failed.join(', ')]);
  if (r.warnCount) lines.push(['t-sub', r.warnCount + ' extraction point(s) with warnings']);
  if (r.status === 'logged_out') lines.push(['t-sub', 'session stale \u2014 re-run the login helper']);
  if (r.geo) lines.push(['t-mut', r.geo]);
  if (r.headline) lines.push(['t-mut', r.headline]);
  return lines;
}

/* ---- sections ---- */
function renderFilters(root) {
  var bar = el('div', 'filters');
  bar.appendChild(el('span', 'label', 'Window'));
  WINDOWS.forEach(function (w) {
    var b = el('button', 'chip');
    b.appendChild(el('span', 'check', '\u2713 '));
    b.appendChild(document.createTextNode(w[0] === 'all' ? 'All time' : 'Last ' + w[0]));
    b.setAttribute('aria-pressed', String(state.win === w[0]));
    b.addEventListener('click', function () { state.win = w[0]; render(); });
    bar.appendChild(b);
  });
  bar.appendChild(el('span', 'divider'));
  bar.appendChild(el('span', 'label', 'Platforms'));
  DATA.platforms.forEach(function (p) {
    var b = el('button', 'chip');
    b.appendChild(el('span', 'check', '\u2713 '));
    b.appendChild(document.createTextNode(LABELS[p]));
    b.setAttribute('aria-pressed', String(!!state.plats[p]));
    b.addEventListener('click', function () { state.plats[p] = !state.plats[p]; render(); });
    bar.appendChild(b);
  });
  root.appendChild(bar);
}

function renderKpis(root, cells, runs) {
  var totals = { cells: 0, healthy: 0, pass: 0, warn: 0, fail: 0 };
  var last = null;
  Object.keys(cells).forEach(function (p) {
    Object.keys(cells[p]).forEach(function (rg) {
      var r = cells[p][rg];
      totals.cells++;
      var st = statusOf(r);
      if (st === 'good' || st === 'warning') totals.healthy++;
      r.points.forEach(function (pt) {
        if (pt.status === 'pass') totals.pass++;
        else if (pt.status === 'warn') totals.warn++;
        else totals.fail++;
      });
      if (!last || r.ts > last.ts) last = r;
    });
  });
  var row = el('div', 'cards');

  var hero = el('div', 'card tile hero');
  hero.appendChild(el('div', 'label', 'Platform\u2013regions healthy'));
  var v = el('div', 'value', String(totals.healthy));
  v.appendChild(el('span', 'frac', ' / ' + totals.cells));
  hero.appendChild(v);
  hero.appendChild(el('div', 'note', 'latest run per platform \u00d7 region in window'));
  row.appendChild(hero);

  var pts = el('div', 'card tile');
  pts.appendChild(el('div', 'label', 'Extraction points (latest runs)'));
  pts.appendChild(el('div', 'value', String(totals.pass + totals.warn + totals.fail)));
  var split = el('div', 'split');
  [['good', totals.pass + ' pass'], ['warning', totals.warn + ' warn'], ['critical', totals.fail + ' fail']].forEach(function (s) {
    var it = el('span', 'st-' + s[0]);
    it.style.display = 'inline-flex'; it.style.alignItems = 'center'; it.style.gap = '5px';
    it.appendChild(statusIcon(s[0]).firstChild);
    it.appendChild(document.createTextNode(s[1]));
    split.appendChild(it);
  });
  pts.appendChild(split);
  row.appendChild(pts);

  var cov = el('div', 'card tile');
  cov.appendChild(el('div', 'label', 'Platform coverage'));
  var covered = Object.keys(cells).filter(function (p) { return Object.keys(cells[p]).length; }).length;
  var cv = el('div', 'value', String(covered));
  cv.appendChild(el('span', 'frac', ' / ' + DATA.platforms.length));
  cov.appendChild(cv);
  cov.appendChild(el('div', 'note', runs.length + ' run(s) in window'));
  row.appendChild(cov);

  var lastTile = el('div', 'card tile');
  lastTile.appendChild(el('div', 'label', 'Most recent run'));
  lastTile.appendChild(el('div', 'value', last ? ago(last.ts) : '\u2014'));
  lastTile.appendChild(el('div', 'note', last ? LABELS[last.platform] + ' \u00b7 ' + last.region.toUpperCase() : 'no runs in window'));
  row.appendChild(lastTile);

  root.appendChild(row);
}

function renderMatrix(root, cells) {
  var sec = el('div', 'section');
  sec.appendChild(el('h2', null, 'Status by platform and region'));
  var regions = {};
  Object.keys(cells).forEach(function (p) { Object.keys(cells[p]).forEach(function (rg) { regions[rg] = true; }); });
  var regionList = Object.keys(regions).sort();
  if (!regionList.length) {
    sec.appendChild(el('div', 'empty', 'No runs in this window \u2014 widen the time filter or run ./vpnrun.sh health \u2026'));
    root.appendChild(sec);
    return;
  }
  var tbl = el('table', 'matrix');
  var thead = el('thead'); var hr = el('tr');
  hr.appendChild(el('th', null, ''));
  regionList.forEach(function (rg) { hr.appendChild(el('th', null, rg.toUpperCase())); });
  thead.appendChild(hr); tbl.appendChild(thead);
  var tbody = el('tbody');
  DATA.platforms.filter(function (p) { return state.plats[p]; }).forEach(function (p) {
    var tr = el('tr');
    var th = el('th', 'rowh', LABELS[p]); th.scope = 'row';
    tr.appendChild(th);
    regionList.forEach(function (rg) {
      var r = (cells[p] || {})[rg] || null;
      var st = statusOf(r);
      var td = el('td', 'cell st-' + st);
      var box = el('div', 'box' + (r && isStale(r) ? ' stale' : ''));
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', LABELS[p] + ' ' + rg.toUpperCase() + ': ' + STATUS_META[st].label);
      box.appendChild(statusIcon(st).firstChild);
      if (r) box.appendChild(el('span', null, ago(r.ts).replace(' ago', '')));
      if (r) attachTip(box, function () { return cellTipLines(r, st); });
      td.appendChild(box);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  sec.appendChild(tbl);

  var leg = el('div', 'legend');
  ['good', 'warning', 'critical', 'serious', 'none'].forEach(function (st) {
    var it = el('span', 'item st-' + st);
    it.appendChild(statusIcon(st).firstChild);
    it.appendChild(document.createTextNode(STATUS_META[st].label));
    leg.appendChild(it);
  });
  leg.appendChild(el('span', 'item muted', 'Faded cell = latest run is >7 days old'));
  sec.appendChild(leg);
  root.appendChild(sec);
}

function computeObservations(cells, runs) {
  var obs = [];
  Object.keys(cells).forEach(function (p) {
    Object.keys(cells[p]).forEach(function (rg) {
      var r = cells[p][rg];
      var where = LABELS[p] + ' \u00b7 ' + rg.toUpperCase();
      if (r.status === 'logged_out') {
        obs.push({ st: 'serious', what: 'Session stale', detail: 'the saved session no longer logs in \u2014 re-run npm run login:' + (p === 'hbomax' ? 'max' : p), where: where });
        return;
      }
      if (statusOf(r) === 'serious') {
        obs.push({ st: 'serious', what: 'Run did not complete', detail: 'status "' + r.status + '" \u2014 see the report/log for the driver error', where: where });
        return;
      }
      r.points.forEach(function (pt) {
        if (pt.status === 'fail') {
          var d = pt.issues.length ? pt.issues[0].detail : 'no detail';
          obs.push({ st: 'critical', what: pt.name + ' failing', detail: d, where: where });
        }
      });
      var warns = r.points.filter(function (pt) { return pt.status === 'warn'; });
      if (warns.length) {
        var names = warns.map(function (w) { return w.name; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
        obs.push({ st: 'warning', what: names.join(', ') + ' warning', detail: warns[0].issues.length ? warns[0].issues[0].detail : '', where: where });
      }
      if (r.routed && r.routed.toLowerCase() !== rg.toLowerCase()) {
        obs.push({ st: 'critical', what: 'Geo mismatch', detail: 'requested region ' + rg.toUpperCase() + ' but the platform routed the session to ' + r.routed, where: where });
      }
      var slow = r.points.filter(function (pt) { return (pt.latencyMs || 0) > 3000; });
      if (slow.length) {
        obs.push({ st: 'warning', what: 'Slow responses', detail: slow.map(function (s2) { return s2.name + ' ' + (s2.latencyMs / 1000).toFixed(1) + 's'; }).join(', '), where: where });
      }
    });
  });
  // flapping: same platform+region changed verdict within the window
  var byCell = {};
  runs.forEach(function (r) {
    var k = r.platform + '|' + r.region;
    (byCell[k] = byCell[k] || []).push(r);
  });
  Object.keys(byCell).forEach(function (k) {
    var list = byCell[k];
    var verdicts = list.map(statusOf).filter(function (s) { return s !== 'serious'; });
    var flips = 0;
    for (var i = 1; i < verdicts.length; i++) if ((verdicts[i] === 'critical') !== (verdicts[i - 1] === 'critical')) flips++;
    if (flips >= 2) {
      var parts = k.split('|');
      obs.push({ st: 'warning', what: 'Flapping', detail: 'verdict changed ' + flips + ' times across ' + list.length + ' runs in this window', where: LABELS[parts[0]] + ' \u00b7 ' + parts[1].toUpperCase() });
    }
  });
  // coverage gaps
  DATA.platforms.filter(function (p) { return state.plats[p]; }).forEach(function (p) {
    if (!cells[p] || !Object.keys(cells[p]).length) {
      obs.push({ st: 'none', what: 'Never tested in window', detail: 'no ' + LABELS[p] + ' reports \u2014 run ./vpnrun.sh health ' + p + ' <region>', where: LABELS[p] });
    }
  });
  var order = { critical: 0, serious: 1, warning: 2, none: 3 };
  obs.sort(function (a, b) { return order[a.st] - order[b.st]; });
  return obs;
}

function renderObservations(root, cells, runs) {
  var sec = el('div', 'section');
  sec.appendChild(el('h2', null, 'Observations'));
  var obs = computeObservations(cells, runs);
  if (!obs.length) {
    sec.appendChild(el('div', 'empty', 'Nothing to flag \u2014 every tested platform\u2013region is healthy in this window. \u2713'));
  } else {
    var ul = el('ul', 'obs');
    obs.slice(0, 30).forEach(function (o) {
      var li = el('li', 'st-' + o.st);
      li.appendChild(statusIcon(o.st).firstChild);
      var body = el('span');
      body.appendChild(el('span', 'what', o.what + ' '));
      body.appendChild(el('span', 'detail', o.detail ? '\u2014 ' + o.detail + ' ' : ''));
      body.appendChild(el('span', 'where', '(' + o.where + ')'));
      li.appendChild(body);
      ul.appendChild(li);
    });
    if (obs.length > 30) ul.appendChild(el('li', 'muted', '\u2026 and ' + (obs.length - 30) + ' more'));
    sec.appendChild(ul);
  }
  root.appendChild(sec);
}

function renderStrip(runsForCell) {
  var strip = el('span', 'strip');
  runsForCell.slice(-20).forEach(function (r) {
    var st = statusOf(r);
    var sq = el('span', 'sq st-' + st);
    sq.setAttribute('role', 'img');
    sq.setAttribute('aria-label', STATUS_META[st].label + ', ' + ago(r.ts));
    attachTip(sq, function () { return cellTipLines(r, st); });
    strip.appendChild(sq);
  });
  return strip;
}

function renderPlatformCards(root, cells, runs) {
  DATA.platforms.filter(function (p) { return state.plats[p] && cells[p] && Object.keys(cells[p]).length; }).forEach(function (p) {
    var sec = el('div', 'section');
    var head = el('div', 'plat-head');
    head.appendChild(el('h2', null, LABELS[p]));
    head.appendChild(el('span', 'count', Object.keys(cells[p]).length + ' region(s) \u00b7 ' + runs.filter(function (r) { return r.platform === p; }).length + ' run(s) in window'));
    sec.appendChild(head);

    Object.keys(cells[p]).sort().forEach(function (rg) {
      var r = cells[p][rg];
      var st = statusOf(r);
      var block = el('div', 'region-block');
      var rh = el('div', 'region-head');
      rh.appendChild(el('span', 'rg', rg));
      var chip = el('span', 'chipst st-' + st);
      chip.appendChild(statusIcon(st).firstChild);
      chip.appendChild(document.createTextNode(STATUS_META[st].label));
      rh.appendChild(chip);
      var meta = ago(r.ts) + (durationOf(r) ? ' \u00b7 ' + durationOf(r) : '');
      if (r.geo) meta += ' \u00b7 ' + r.geo;
      if (r.account && r.account.profilesTotal != null) meta += ' \u00b7 ' + (r.account.profilesTested || 1) + '/' + r.account.profilesTotal + ' profile(s) tested';
      rh.appendChild(el('span', 'meta', meta));
      var hist = runs.filter(function (x) { return x.platform === p && x.region === rg; });
      if (hist.length > 1) rh.appendChild(renderStrip(hist));
      block.appendChild(rh);
      if (r.headline) block.appendChild(el('div', 'headline', r.headline));

      if (r.points.length) {
        var maxLat = Math.max.apply(null, r.points.map(function (pt) { return pt.latencyMs || 0; }).concat([1]));
        var tbl = el('table', 'points');
        var th = el('tr');
        ['Extraction point', 'Status', 'HTTP', 'Latency', 'Notes'].forEach(function (h) { th.appendChild(el('th', null, h)); });
        var thead = el('thead'); thead.appendChild(th); tbl.appendChild(thead);
        var tbody = el('tbody');
        r.points.forEach(function (pt) {
          var tr = el('tr');
          var nm = el('td', 'nm', pt.name);
          if (pt.profile) nm.appendChild(el('div', 'prof', String(pt.profile).slice(0, 24)));
          tr.appendChild(nm);
          var stc = pt.status === 'pass' ? 'good' : pt.status === 'warn' ? 'warning' : 'critical';
          var sd = el('td', 'st-' + stc);
          var wrap = el('span', 'chipst st-' + stc);
          wrap.appendChild(statusIcon(stc).firstChild);
          wrap.appendChild(document.createTextNode(pt.status));
          sd.appendChild(wrap);
          tr.appendChild(sd);
          tr.appendChild(el('td', 'num', pt.httpStatus != null ? String(pt.httpStatus) : '\u2014'));
          var lat = el('td', 'num');
          if (pt.latencyMs != null) {
            var bar = el('span', 'latbar');
            var track = el('span', 'track');
            var fill = el('span', 'fill');
            fill.style.width = Math.max(3, Math.round((pt.latencyMs / maxLat) * 100)) + '%';
            track.appendChild(fill); bar.appendChild(track);
            bar.appendChild(el('span', null, pt.latencyMs >= 1000 ? (pt.latencyMs / 1000).toFixed(1) + 's' : pt.latencyMs + 'ms'));
            lat.appendChild(bar);
          } else lat.textContent = '\u2014';
          tr.appendChild(lat);
          var iss = el('td', 'iss');
          pt.issues.forEach(function (i2) { iss.appendChild(el('div', null, i2.detail)); });
          if (!pt.issues.length) iss.appendChild(el('span', 'muted', '\u2014'));
          tr.appendChild(iss);
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        block.appendChild(tbl);
      } else {
        block.appendChild(el('div', 'empty', 'No extraction points ran (' + r.status + ').'));
      }
      sec.appendChild(block);
    });
    root.appendChild(sec);
  });
}

function render() {
  hideTip();
  var root = document.getElementById('app');
  root.textContent = '';
  var runs = runsInWin();
  var cells = latestCells(runs);
  renderFilters(root);
  renderKpis(root, cells, runs);
  renderMatrix(root, cells);
  renderObservations(root, cells, runs);
  renderPlatformCards(root, cells, runs);
  var foot = el('footer');
  foot.textContent = 'Generated ' + new Date(DATA.generatedAt).toLocaleString() + ' from ' + DATA.runs.length + ' report(s) in ' + DATA.reportsDir +
    ' \u00b7 regenerate with ./dashboard.sh' + (DATA.skipped.length ? ' \u00b7 ' + DATA.skipped.length + ' unreadable report(s) skipped' : '');
  root.appendChild(foot);
}

document.getElementById('themeBtn').addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
});
render();
setInterval(function () { NOW = Date.now(); render(); }, 60000);
</script>
</body>
